# Inside the existing public server block (case-seo-site).
# Native pairing and upload password are also checked by the Python handler.
location /pan-api/accelerator/ {
    if ($simple_netdisk_block_write) {
        return 418;
    }
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8091/api/accelerator/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
