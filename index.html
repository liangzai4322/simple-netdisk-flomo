  <link rel="shortcut icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%0A%20%20%3Cdefs%3E%0A%20%20%20%20%3ClinearGradient%20id%3D%22g%22%20x1%3D%228%22%20y1%3D%226%22%20x2%3D%2256%22%20y2%3D%2258%22%20gradientUnits%3D%22userSpaceOnUse%22%3E%0A%20%20%20%20%20%20%3Cstop%20stop-color%3D%22%2334d399%22%2F%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%220.5%22%20stop-color%3D%22%231f6feb%22%2F%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%221%22%20stop-color%3D%22%237c3aed%22%2F%3E%0A%20%20%20%20%3C%2FlinearGradient%3E%0A%20%20%3C%2Fdefs%3E%0A%20%20%3Crect%20x%3D%224%22%20y%3D%224%22%20width%3D%2256%22%20height%3D%2256%22%20rx%3D%2218%22%20fill%3D%22url%28%23g%29%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M20%2039h23a7%207%200%200%200%200-14%2013%2013%200%200%200-25-1%208%208%200%200%200%202%2015Z%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M25%2045h15m0%200-5-5m5%205-5%205%22%20fill%3D%22none%22%20stroke%3D%22%23fef3c7%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%0A%3C%2Fsvg%3E">
  <meta name="theme-color" content="#1f6feb">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --line: #d9dee7;
      --text: #18202a;
      --muted: #687586;
      --accent: #1f6feb;
      --danger: #c53030;
      --ok: #087f5b;
      --soft: #eef3f8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
    }
    header {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 24px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    h1, h2 {
      margin: 0;
      letter-spacing: 0;
    }
    h1 { font-size: 20px; font-weight: 700; }
    h2 { font-size: 18px; font-weight: 700; }
    .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }

    .logo-lockup {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }
    .logo-mark {
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      filter: drop-shadow(0 8px 16px rgba(31, 111, 235, .18));
    }
    .brand-title {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .brand-title span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
      white-space: nowrap;
    }
    .nav-link {
      height: 34px;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      color: var(--text);
      text-decoration: none;
      background: #fff;
      white-space: nowrap;
    }
    main {
      width: min(1320px, calc(100vw - 32px));
      margin: 24px auto 40px;
    }
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr);
      gap: 18px;
      align-items: start;
    }
    .file-column, .flomo-column { min-width: 0; }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 190px auto auto;
      gap: 10px;
      align-items: center;
      padding: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    input[type="file"], input[type="password"], input[type="search"], .note-input, textarea {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      padding: 8px 10px;
      font: inherit;
    }
    input[type="file"], input[type="password"], input[type="search"], .note-input {
      height: 40px;
    }
    textarea {
      width: 100%;
      min-height: 118px;
      resize: vertical;
      line-height: 1.6;
    }
    textarea:focus, input:focus {
      border-color: var(--accent);
      outline: 2px solid rgba(31, 111, 235, .14);
    }
    .note-input { width: 100%; height: 36px; }
    .note-input.dirty {
      border-color: #d97706;
      background: #fffaf0;
    }
    button, .button-link {
      height: 40px;
      min-width: 76px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      font: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      text-decoration: none;
      white-space: nowrap;
    }
    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }
    button.danger { color: var(--danger); }
    button:disabled { cursor: not-allowed; opacity: .55; }
    #status {
      min-width: 160px;
      text-align: right;
      color: var(--muted);
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #status.ok { color: var(--ok); }
    #status.err { color: var(--danger); }
    .card {
      margin-top: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
    }
    th {
      height: 44px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 620;
      background: #fbfcfe;
    }
    tr:last-child td { border-bottom: 0; }
    .section-row td {
      height: 38px;
      padding: 10px 14px;
      background: var(--soft);
      color: #344054;
      font-size: 13px;
      font-weight: 700;
      border-top: 1px solid var(--line);
    }
    .name-cell {
      width: 30%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 560;
    }
    .note-cell { width: 28%; }
    .size-cell { width: 10%; color: var(--muted); }
    .time-cell { width: 18%; color: var(--muted); }
    .action-cell { width: 14%; text-align: right; }
    .actions {
      display: inline-flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .empty {
      padding: 36px 16px;
      text-align: center;
      color: var(--muted);
    }
    .flomo {
      margin-top: 0;
      position: sticky;
      top: 86px;
      max-height: calc(100vh - 104px);
      overflow: auto;
      padding-right: 2px;
    }
    .flomo-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .hint {
      color: var(--muted);
      font-size: 13px;
    }
    .composer {
      padding: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .paste-zone {
      margin-top: 10px;
      border: 1px dashed #b8c2d0;
      border-radius: 7px;
      min-height: 52px;
      padding: 12px;
      color: var(--muted);
      background: #fbfcfe;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .paste-zone.active {
      border-color: var(--accent);
      color: var(--accent);
      background: #f0f6ff;
    }
    .image-preview-list, .memo-images {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .preview-thumb {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #f8fafc;
      overflow: hidden;
    }
    .preview-thumb img {
      display: block;
      width: 100%;
      height: 110px;
      object-fit: contain;
    }
    .preview-thumb button {
      position: absolute;
      top: 6px;
      right: 6px;
      min-width: 28px;
      width: 28px;
      height: 28px;
      padding: 0;
      color: var(--danger);
      background: rgba(255,255,255,.92);
    }
    .composer-actions {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .memo-feed {
      margin-top: 14px;
      display: grid;
      gap: 12px;
    }
    .memo-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
    }
    .memo-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }
    .memo-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.68;
      position: relative;
    }
    .memo-text.collapsed {
      max-height: 10.1em;
      overflow: hidden;
    }
    .memo-text.collapsed::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3.2em;
      background: linear-gradient(to bottom, rgba(255,255,255,0), #fff);
      pointer-events: none;
    }
    .memo-toggle {
      margin-top: 8px;
      height: 32px;
      min-width: 58px;
      color: var(--accent);
      padding: 0 9px;
    }
    .memo-images img {
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #f8fafc;
      cursor: zoom-in;
    }
    .memo-top-actions {
      display: inline-flex;
      gap: 8px;
      align-items: center;
    }
    .memo-top-actions button {
      height: 30px;
      min-width: 54px;
      padding: 0 8px;
      font-size: 13px;
    }
    .upload-progress {
      display: none;
      grid-column: 1 / -1;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
    }
    .upload-progress.active { display: block; }
    .upload-progress-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 13px;
    }
    .upload-progress-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .upload-progress-track {
      height: 9px;
      overflow: hidden;
      border-radius: 999px;
      background: #e8edf5;
    }
    .upload-progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #1f6feb, #34d399);
      transition: width .15s ease;
    }
    @media (max-width: 720px) {
      header { padding: 12px 16px; flex-direction: column; align-items: stretch; }
      .brand { justify-content: space-between; }
      .logo-mark { width: 40px; height: 40px; }
      .brand-title span { display: none; }
      main { width: calc(100vw - 20px); margin-top: 10px; }
      .workspace { grid-template-columns: 1fr; }
      .flomo { position: static; max-height: none; overflow: visible; padding-right: 0; }
      .toolbar { grid-template-columns: 1fr; }
      #status { min-width: 0; max-width: none; text-align: left; }
      th.size-cell, td.size-cell, th.time-cell, td.time-cell { display: none; }
      .name-cell { width: 34%; }
      .note-cell { width: 42%; }
      .action-cell { width: 24%; }
      th, td { padding: 10px 8px; }
      .section-row td { padding: 10px 8px; }
      .actions { gap: 6px; }
      button, .button-link { min-width: 58px; padding: 0 8px; }
      .flomo-head { align-items: flex-start; flex-direction: column; }
      .image-preview-list, .memo-images { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
      .memo-images img { max-height: 190px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo-lockup">
        <svg class="logo-mark" viewBox="0 0 64 64" role="img" aria-label="无痕同步 Logo">
          <defs>
            <linearGradient id="lzLogoBg" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
              <stop stop-color="#34d399"/>
              <stop offset="0.48" stop-color="#1f6feb"/>
              <stop offset="1" stop-color="#7c3aed"/>
            </linearGradient>
            <linearGradient id="lzLogoCard" x1="35" y1="29" x2="52" y2="52" gradientUnits="userSpaceOnUse">
              <stop stop-color="#ffffff"/>
              <stop offset="1" stop-color="#eaf2ff"/>
            </linearGradient>
          </defs>
          <rect x="4" y="4" width="56" height="56" rx="18" fill="url(#lzLogoBg)"/>
          <path d="M20.2 41.2h17.4c4.5 0 8.1-3.3 8.1-7.4 0-3.7-2.9-6.8-6.8-7.3C37.2 21.8 32.9 18.6 28 18.6c-5.7 0-10.4 4.3-10.9 9.9-4 .8-7 4.1-7 8.1 0 2.5 1.2 4.6 3.1 6" fill="none" stroke="#fff" stroke-width="5.1" stroke-linecap="round" stroke-linejoin="round" opacity="0.94"/>
          <rect x="34" y="29" width="19" height="22" rx="5" fill="url(#lzLogoCard)"/>
          <path d="M47.8 29v5.2H53" fill="none" stroke="#8ab4ff" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M39.2 37.2h8.7M39.2 42.2h6.5" stroke="#1f6feb" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M18 19.5l1.6 3.2 3.4 1.5-3.4 1.5L18 29l-1.6-3.3-3.4-1.5 3.4-1.5L18 19.5Z" fill="#fef3c7" opacity="0.95"/>
        </svg>
        <div class="brand-title">
          <h1>无痕同步</h1>
          <span>Netdisk · Flomo</span>
        </div>
      </div>
      <a class="nav-link" href="#flomo">Flomo</a>
    </div>
    <div id="status">正在加载</div>
  </header>
  <main>
    <div class="workspace">
      <section class="file-column">
        <section class="toolbar">
      <input id="fileInput" type="file" multiple>
      <input id="passwordInput" type="password" inputmode="numeric" autocomplete="current-password" placeholder="首次输入密码，之后自动记住" title="密码仅保存在当前浏览器本地">
      <button id="uploadBtn" class="primary">上传</button>
      <button id="refreshBtn">刷新</button>
        </section>
        <section id="uploadProgress" class="upload-progress" aria-live="polite">
          <div class="upload-progress-meta">
            <span id="uploadProgressName" class="upload-progress-name">准备上传</span>
            <strong id="uploadProgressText">0%</strong>
          </div>
          <div class="upload-progress-track"><div id="uploadProgressBar" class="upload-progress-bar"></div></div>
        </section>
        <section class="card">
      <table aria-label="文件列表">
        <thead>
          <tr>
            <th class="name-cell">文件名</th>
            <th class="note-cell">备注</th>
            <th class="size-cell">大小</th>
            <th class="time-cell">上传时间</th>
            <th class="action-cell">操作</th>
          </tr>
        </thead>
        <tbody id="fileList"></tbody>
      </table>
      <div id="emptyState" class="empty" hidden>暂无文件</div>
        </section>
      </section>

      <aside id="flomo" class="flomo flomo-column">
      <div class="flomo-head">
        <div>
          <h2>Flomo 同步区</h2>
          <div class="hint">写文字、Ctrl+V 粘贴图片，点“同步”后会保存到服务器；长文字自动折叠。</div>
        </div>
        <input id="memoSearchInput" type="search" placeholder="搜索 flomo">
      </div>
      <div class="composer">
        <textarea id="memoInput" maxlength="5000" placeholder="记录文字；Ctrl+V 可以直接粘贴图片；Ctrl+Enter 同步"></textarea>
        <div id="pasteZone" class="paste-zone" tabindex="0">点击这里或文本框后，Ctrl+V 粘贴图片</div>
        <div id="imagePreviewList" class="image-preview-list"></div>
        <div class="composer-actions">
          <div class="hint">图片不会塞进文件列表，会作为 flomo 图片保存在服务器。</div>
          <div class="actions">
            <button id="clearMemoBtn">清空</button>
            <button id="publishMemoBtn" class="primary">同步</button>
          </div>
        </div>
      </div>
      <div id="memoFeed" class="memo-feed"></div>
      </aside>
    </div>
  </main>
  <script>
    const fileInput = document.getElementById('fileInput');
    const passwordInput = document.getElementById('passwordInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const uploadProgress = document.getElementById('uploadProgress');
    const uploadProgressName = document.getElementById('uploadProgressName');
    const uploadProgressText = document.getElementById('uploadProgressText');
    const uploadProgressBar = document.getElementById('uploadProgressBar');
    const PASSWORD_STORAGE_KEY = 'wuhen-sync-upload-password-v1';

    function restoreSavedPassword() {
      try {
        const savedPassword = localStorage.getItem(PASSWORD_STORAGE_KEY) || '';
        if (savedPassword) passwordInput.value = savedPassword;
      } catch (err) {}
    }

    function rememberPassword() {
      const value = passwordInput.value.trim();
      try {
        if (value) localStorage.setItem(PASSWORD_STORAGE_KEY, value);
        else localStorage.removeItem(PASSWORD_STORAGE_KEY);
      } catch (err) {}
    }

    restoreSavedPassword();
    passwordInput.addEventListener('change', rememberPassword);
    passwordInput.addEventListener('blur', rememberPassword);
    const fileList = document.getElementById('fileList');
    const emptyState = document.getElementById('emptyState');
    const statusEl = document.getElementById('status');
    const API_BASE = (window.SIMPLE_NETDISK_API_BASE || (location.pathname.startsWith('/pan') ? '/pan-api' : '')).replace(/\/$/, '');
    function apiUrl(path) {
      if (!API_BASE) return path;
      if (API_BASE.endsWith('/pan-api') && path.startsWith('/api/')) {
        return API_BASE + path.slice(4);
      }
      return API_BASE + path;
    }
    function absoluteApiUrl(path) { return new URL(apiUrl(path), location.href).href; }
    const memoInput = document.getElementById('memoInput');
    const pasteZone = document.getElementById('pasteZone');
    const imagePreviewList = document.getElementById('imagePreviewList');
    const publishMemoBtn = document.getElementById('publishMemoBtn');
    const clearMemoBtn = document.getElementById('clearMemoBtn');
    const memoFeed = document.getElementById('memoFeed');
    const memoSearchInput = document.getElementById('memoSearchInput');
    let pendingImages = [];
    let memos = [];

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = kind || '';
    }

    function cleanName(name) {
      return name.replace(/[\\/]+/g, '_').trim() || 'untitled';
    }

    function encodePath(path) {
      const value = path.charAt(0) === '/' ? path : '/' + path;
      return value.split('/').map(function(part, index) {
        return index === 0 ? '' : encodeURIComponent(part);
      }).join('/');
    }

    function formatSize(bytes) {
      if (!bytes) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      let size = Number(bytes);
      let index = 0;
      while (size >= 1024 && index < units.length - 1) {
        size = size / 1024;
        index += 1;
      }
      return (index === 0 ? size.toFixed(0) : size.toFixed(1)) + ' ' + units[index];
    }

    function formatTime(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return date.toLocaleString('zh-CN', { hour12: false });
    }

    function renderLinkedText(container, raw) {
      container.textContent = '';
      const text = raw || '';
      const re = /(https?:\/\/[^\s<>'\"]+|www\.[^\s<>'\"]+)/gi;
      let last = 0;
      let match;
      while ((match = re.exec(text)) !== null) {
        container.appendChild(document.createTextNode(text.slice(last, match.index)));
        let label = match[0];
        let trailing = '';
        while (/[),.，。！？!?]$/.test(label)) {
          trailing = label.slice(-1) + trailing;
          label = label.slice(0, -1);
        }
        const href = label.startsWith('www.') ? 'https://' + label : label;
        const a = document.createElement('a');
        a.href = href;
        a.target = '_blank';
        a.rel = 'noreferrer';
        a.textContent = label;
        container.appendChild(a);
        if (trailing) container.appendChild(document.createTextNode(trailing));
        last = match.index + match[0].length;
      }
      container.appendChild(document.createTextNode(text.slice(last)));
    }

    function startOfDay(date) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate());
    }

    function sectionLabel(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '更早';
      const today = startOfDay(new Date());
      const day = startOfDay(date);
      const diff = Math.floor((today - day) / 86400000);
      if (diff <= 0) return '今天';
      if (diff === 1) return '昨天';
      if (diff < 7) return '过去一周';
      return '一周前';
    }

    async function request(path, options) {
      const res = await fetch(apiUrl(path), options || {});
      if (!res.ok) {
        if (res.status === 401 || res.status === 403) throw new Error('密码不正确');
        throw new Error('请求失败：' + res.status);
      }
      return res;
    }

    async function loadFiles() {
      const res = await request('/api/resources/');
      const data = await res.json();
      const items = Array.isArray(data.items) ? data.items : [];
      items.sort(function(a, b) {
        return new Date(b.modified || 0).getTime() - new Date(a.modified || 0).getTime();
      });
      fileList.innerHTML = '';
      emptyState.hidden = items.length !== 0;
      let currentSection = '';
      for (const item of items) {
        const section = sectionLabel(item.modified);
        if (section !== currentSection) {
          currentSection = section;
          const sectionRow = document.createElement('tr');
          sectionRow.className = 'section-row';
          const sectionCell = document.createElement('td');
          sectionCell.colSpan = 5;
          sectionCell.textContent = section;
          sectionRow.appendChild(sectionCell);
          fileList.appendChild(sectionRow);
        }

        const row = document.createElement('tr');
        const path = item.path || ('/' + item.name);
        const encoded = encodePath(path);
        const nameCell = document.createElement('td');
        nameCell.className = 'name-cell';
        nameCell.title = item.name || path;
        nameCell.textContent = item.isDir ? (item.name + '/') : item.name;

        const noteCell = document.createElement('td');
        noteCell.className = 'note-cell';
        const noteInput = document.createElement('input');
        noteInput.className = 'note-input';
        noteInput.type = 'text';
        noteInput.maxLength = 5000;
        noteInput.placeholder = '输入备注后回车';
        noteInput.value = item.note || '';
        noteInput.dataset.savedValue = item.note || '';
        noteInput.addEventListener('input', function() {
          noteInput.classList.toggle('dirty', noteInput.value !== noteInput.dataset.savedValue);
        });
        noteInput.addEventListener('keydown', function(event) {
          if (event.key === 'Enter') {
            event.preventDefault();
            saveNote(path, noteInput);
          }
        });
        noteCell.appendChild(noteInput);

        const sizeCell = document.createElement('td');
        sizeCell.className = 'size-cell';
        sizeCell.textContent = item.isDir ? '-' : formatSize(item.size);

        const timeCell = document.createElement('td');
        timeCell.className = 'time-cell';
        timeCell.textContent = formatTime(item.modified);

        const actionCell = document.createElement('td');
        actionCell.className = 'action-cell';
        const actions = document.createElement('div');
        actions.className = 'actions';

        if (!item.isDir) {
          const download = document.createElement('a');
          download.className = 'button-link';
          download.href = apiUrl('/api/raw' + encoded);
          download.download = item.name || '';
          download.textContent = '下载';
          actions.appendChild(download);
        }

        const del = document.createElement('button');
        del.className = 'danger';
        del.type = 'button';
        del.textContent = '删除';
        del.addEventListener('click', function() { deleteItem(path, item.name || path); });
        actions.appendChild(del);
        actionCell.appendChild(actions);

        row.appendChild(nameCell);
        row.appendChild(noteCell);
        row.appendChild(sizeCell);
        row.appendChild(timeCell);
        row.appendChild(actionCell);
        fileList.appendChild(row);
      }
    }

    function formatBytes(bytes) {
      if (!Number.isFinite(bytes) || bytes <= 0) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
      return (bytes / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
    }

    function setUploadProgress(name, percent, loaded, total, index, count) {
      uploadProgress.classList.add('active');
      uploadProgressName.textContent = index + '/' + count + ' · ' + name + ' · ' + formatBytes(loaded) + ' / ' + formatBytes(total);
      uploadProgressText.textContent = percent + '%';
      uploadProgressBar.style.width = percent + '%';
    }

    function uploadOneFile(target, file, pass, onProgress) {
      return new Promise(function(resolve, reject) {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', apiUrl(target), true);
        xhr.setRequestHeader('X-Upload-Password', pass);
        xhr.upload.addEventListener('progress', function(event) {
          if (event.lengthComputable) onProgress(event.loaded, event.total);
        });
        xhr.addEventListener('load', function() {
          if (xhr.status >= 200 && xhr.status < 300) return resolve();
          if (xhr.status === 401 || xhr.status === 403) return reject(new Error('密码不正确'));
          if (xhr.status === 413) return reject(new Error('服务器仍有限制：413'));
          reject(new Error('上传失败：' + xhr.status));
        });
        xhr.addEventListener('error', function() { reject(new Error('网络连接中断')); });
        xhr.addEventListener('abort', function() { reject(new Error('上传已取消')); });
        xhr.send(file);
      });
    }

    async function uploadFiles() {
      const files = Array.from(fileInput.files || []);
      const pass = passwordInput.value.trim();
      if (files.length === 0) {
        setStatus('请选择文件', 'err');
        return;
      }
      if (!pass) {
        setStatus('请输入密码', 'err');
        passwordInput.focus();
        return;
      }
      rememberPassword();
      uploadBtn.disabled = true;
      try {
        let completedBytes = 0;
        const allBytes = files.reduce(function(sum, file) { return sum + file.size; }, 0);
        for (let i = 0; i < files.length; i += 1) {
          const file = files[i];
          const target = '/api/resources/' + encodeURIComponent(cleanName(file.name)) + '?override=true';
          setStatus('上传中 ' + (i + 1) + '/' + files.length);
          setUploadProgress(file.name, Math.round(completedBytes / Math.max(allBytes, 1) * 100), completedBytes, allBytes, i + 1, files.length);
          await uploadOneFile(target, file, pass, function(fileLoaded) {
            const loaded = completedBytes + fileLoaded;
            const percent = Math.min(99, Math.round(loaded / Math.max(allBytes, 1) * 100));
            setUploadProgress(file.name, percent, loaded, allBytes, i + 1, files.length);
          });
          completedBytes += file.size;
        }
        setUploadProgress('全部文件上传完成', 100, allBytes, allBytes, files.length, files.length);
        fileInput.value = '';
        setStatus('上传完成', 'ok');
        await loadFiles();
        setTimeout(function() { uploadProgress.classList.remove('active'); }, 2500);
      } catch (err) {
        setStatus(err.message || '上传失败', 'err');
        uploadProgressName.textContent = err.message || '上传失败';
        uploadProgress.classList.add('active');
      } finally {
        uploadBtn.disabled = false;
      }
    }

    async function saveNote(path, input) {
      const pass = passwordInput.value.trim();
      if (!pass) {
        setStatus('请输入密码', 'err');
        passwordInput.focus();
        return;
      }
      rememberPassword();
      input.disabled = true;
      try {
        const res = await request('/api/notes' + encodePath(path), {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Upload-Password': pass
          },
          body: JSON.stringify({ note: input.value })
        });
        const data = await res.json();
        input.value = data.note || '';
        input.dataset.savedValue = input.value;
        input.classList.remove('dirty');
        setStatus('备注已保存', 'ok');
      } catch (err) {
        setStatus(err.message || '备注保存失败', 'err');
      } finally {
        input.disabled = false;
        input.focus();
      }
    }

    async function deleteItem(path, name) {
      const pass = passwordInput.value.trim() || window.prompt('删除密码');
      if (!pass) return;
      passwordInput.value = pass;
      rememberPassword();
      if (!window.confirm('删除 ' + name + '？')) return;
      try {
        await request('/api/resources' + encodePath(path), {
          method: 'DELETE',
          headers: { 'X-Upload-Password': pass }
        });
        setStatus('已删除', 'ok');
        await loadFiles();
      } catch (err) {
        setStatus(err.message || '删除失败', 'err');
      }
    }

    function addPendingImage(file) {
      if (!file || !file.type || !file.type.startsWith('image/')) return;
      const ext = file.type.split('/')[1] || 'png';
      const named = file.name ? file : new File([file], 'paste-' + Date.now() + '.' + ext, { type: file.type });
      pendingImages.push(named);
      renderPendingImages();
      setStatus('已粘贴图片 ' + pendingImages.length + ' 张', 'ok');
    }

    function renderPendingImages() {
      imagePreviewList.innerHTML = '';
      pendingImages.forEach(function(file, index) {
        const wrap = document.createElement('div');
        wrap.className = 'preview-thumb';
        const img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        img.onload = function() { URL.revokeObjectURL(img.src); };
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.textContent = '×';
        remove.title = '移除';
        remove.addEventListener('click', function() {
          pendingImages.splice(index, 1);
          renderPendingImages();
        });
        wrap.appendChild(img);
        wrap.appendChild(remove);
        imagePreviewList.appendChild(wrap);
      });
    }

    function handlePaste(event) {
      const items = Array.from((event.clipboardData && event.clipboardData.items) || []);
      let added = 0;
      for (const item of items) {
        if (item.kind === 'file' && item.type.startsWith('image/')) {
          const file = item.getAsFile();
          if (file) {
            addPendingImage(file);
            added += 1;
          }
        }
      }
      if (added) {
        event.preventDefault();
        pasteZone.classList.add('active');
        setTimeout(function() { pasteZone.classList.remove('active'); }, 700);
      }
    }

    async function publishMemo() {
      const pass = passwordInput.value.trim();
      const text = memoInput.value.trim();
      if (!pass) {
        setStatus('请输入密码', 'err');
        passwordInput.focus();
        return;
      }
      rememberPassword();
      if (!text && pendingImages.length === 0) {
        setStatus('请输入文字或粘贴图片', 'err');
        memoInput.focus();
        return;
      }
      publishMemoBtn.disabled = true;
      try {
        const form = new FormData();
        form.append('text', memoInput.value);
        pendingImages.forEach(function(file) {
          form.append('images', file, file.name || ('paste-' + Date.now() + '.png'));
        });
        await request('/api/memos', {
          method: 'POST',
          headers: { 'X-Upload-Password': pass },
          body: form
        });
        memoInput.value = '';
        pendingImages = [];
        renderPendingImages();
        setStatus('已同步', 'ok');
        await loadMemos();
      } catch (err) {
        setStatus(err.message || '同步失败', 'err');
      } finally {
        publishMemoBtn.disabled = false;
      }
    }

    async function loadMemos() {
      const res = await request('/api/memos');
      const data = await res.json();
      memos = Array.isArray(data.items) ? data.items : [];
      renderMemos();
    }

    function renderMemos() {
      const q = memoSearchInput.value.trim().toLowerCase();
      const list = q ? memos.filter(function(memo) {
        return (memo.text || '').toLowerCase().includes(q);
      }) : memos;
      memoFeed.innerHTML = '';
      if (list.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty card';
        empty.textContent = q ? '没有匹配的 flomo' : '暂无 flomo';
        memoFeed.appendChild(empty);
        return;
      }
      for (const memo of list) {
        const card = document.createElement('article');
        card.className = 'memo-card';
        const meta = document.createElement('div');
        meta.className = 'memo-meta';
        const time = document.createElement('span');
        time.textContent = formatTime(memo.created || memo.updated);
        const topActions = document.createElement('div');
        topActions.className = 'memo-top-actions';
        const copy = document.createElement('button');
        copy.type = 'button';
        copy.textContent = '复制';
        copy.addEventListener('click', function() { copyMemo(memo); });
        topActions.appendChild(copy);
        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'danger';
        del.textContent = '删除';
        del.addEventListener('click', function() { deleteMemo(memo); });
        topActions.appendChild(del);
        meta.appendChild(time);
        meta.appendChild(topActions);
        card.appendChild(meta);
        if (memo.text) {
          const text = document.createElement('div');
          text.className = 'memo-text';
          renderLinkedText(text, memo.text);
          card.appendChild(text);
          const toggle = document.createElement('button');
          toggle.type = 'button';
          toggle.className = 'memo-toggle';
          toggle.textContent = '展开';
          toggle.hidden = true;
          let expanded = false;
          toggle.addEventListener('click', function() {
            expanded = !expanded;
            text.classList.toggle('collapsed', !expanded);
            toggle.textContent = expanded ? '收起' : '展开';
          });
          card.appendChild(toggle);
          requestAnimationFrame(function() {
            if ((memo.text || '').length > 220 || text.scrollHeight > text.clientHeight + 8) {
              text.classList.add('collapsed');
              toggle.hidden = false;
            }
          });
        }
        if (Array.isArray(memo.images) && memo.images.length) {
          const images = document.createElement('div');
          images.className = 'memo-images';
          for (const image of memo.images) {
            const link = document.createElement('a');
            link.href = apiUrl(image.url);
            link.target = '_blank';
            link.rel = 'noreferrer';
            const img = document.createElement('img');
            img.src = apiUrl(image.url);
            img.alt = image.name || '';
            link.appendChild(img);
            images.appendChild(link);
          }
          card.appendChild(images);
        }
        memoFeed.appendChild(card);
      }
    }

    async function copyMemo(memo) {
      const parts = [];
      if (memo.text) parts.push(memo.text);
      if (Array.isArray(memo.images) && memo.images.length) {
        parts.push(memo.images.map(function(image) { return absoluteApiUrl(image.url); }).join('\n'));
      }
      const text = parts.join('\n\n');
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const area = document.createElement('textarea');
          area.value = text;
          area.style.position = 'fixed';
          area.style.left = '-9999px';
          document.body.appendChild(area);
          area.focus();
          area.select();
          document.execCommand('copy');
          area.remove();
        }
        setStatus('已复制 flomo', 'ok');
      } catch (err) {
        setStatus('复制失败', 'err');
      }
    }

    async function deleteMemo(memo) {
      const pass = passwordInput.value.trim() || window.prompt('删除密码');
      if (!pass) return;
      passwordInput.value = pass;
      rememberPassword();
      if (!window.confirm('删除这条 flomo？')) return;
      try {
        await request('/api/memos/' + encodeURIComponent(memo.id), {
          method: 'DELETE',
          headers: { 'X-Upload-Password': pass }
        });
        setStatus('已删除 flomo', 'ok');
        await loadMemos();
      } catch (err) {
        setStatus(err.message || '删除失败', 'err');
      }
    }

    function clearMemoDraft() {
      memoInput.value = '';
      pendingImages = [];
      renderPendingImages();
      setStatus('草稿已清空', 'ok');
    }

    uploadBtn.addEventListener('click', uploadFiles);
    refreshBtn.addEventListener('click', async function() {
      setStatus('正在刷新');
      await Promise.all([loadFiles(), loadMemos()]);
      setStatus('已更新', 'ok');
    });
    publishMemoBtn.addEventListener('click', publishMemo);
    clearMemoBtn.addEventListener('click', clearMemoDraft);
    memoSearchInput.addEventListener('input', renderMemos);
    memoInput.addEventListener('paste', handlePaste);
    pasteZone.addEventListener('paste', handlePaste);
    pasteZone.addEventListener('click', function() { pasteZone.focus(); });
    memoInput.addEventListener('keydown', function(event) {
      if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
        event.preventDefault();
        publishMemo();
      }
    });

    (async function init() {
      try {
        setStatus('正在加载');
        await Promise.all([loadFiles(), loadMemos()]);
        setStatus('已更新', 'ok');
      } catch (err) {
        setStatus(err.message || '加载失败', 'err');
      }
    })();
  </script>
</body>
</html>
